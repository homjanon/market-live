name = "market-live"
main = "worker.py"
compatibility_date = "2026-07-15"
compatibility_flags = ["python_workers", "disable_python_external_sdk"]
account_id = "b65a19ca28101390f1195b5109747815"
kv_namespaces = [
  { binding = "KV", id = "cb2f5aca930241d985db5239e0373872" }
]
assets = { directory = "./public", binding = "ASSETS" }
observability = { enabled = true }

# 定时刷新：北京时间周一至周五 9:45–16:15，每 30 分触发（14 次/交易日）
# 注：Cloudflare cron 按 UTC 评估，下方小时字段已 +8 补偿为北京时间。
[triggers]
crons = [
  "45 1 * * mon-fri",        # 北京 09:45（UTC 01:45）
  "15,45 2-7 * * mon-fri",   # 北京 10:15–15:45（每 30 分）
  "15 8 * * mon-fri",        # 北京 16:15（UTC 08:15）
]
