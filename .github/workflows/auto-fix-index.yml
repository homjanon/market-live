name: Auto-fix worker-pushed index.html

# Worker 每次 Cron 会把旧版 public/index.html 覆盖推到 docs/index.html。
# 本工作流检测到旧版特征后自动升级为双路径容错版，避免自定义域名下
# IS_GH 误判导致 "Unexpected token" 加载失败。
#
# 防死循环：Actions 自身的修复 commit 使用 [skip ci]，不会再触发本工作流。
# 幂等：脚本检测到已修复则不改动，不产生 commit。

on:
  push:
    branches: [main]
    paths: ["docs/index.html"]
  workflow_dispatch:
  schedule:
    # 每 15 分钟兜底检查一次（即使 push 触发偶发失败也能自愈）
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: auto-fix-index
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run fix script
        id: fix
        run: |
          python3 .github/scripts/fix_index.py
          if git diff --quiet docs/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push fix
        if: steps.fix.outputs.changed == 'true'
        run: |
          git config user.name "market-live-auto-fix"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "auto-fix: dual-path fallback for custom domain [skip ci]"
          git push
